; PlatformIO project for ESP32-S3-WROOM-1 N8R8 (8 MB Flash + 8 MB Octal PSRAM)
; Verified hardware: ESP32-S3 DevKitC-1 class, ESP32-S3-WROOM-1 MCN8R8 / N8R8
; Docs: https://docs.platformio.org/en/latest/platforms/espressif32.html

[platformio]
default_envs = esp32-s3-n16r8-espdl
boards_dir = boards
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
platform = espressif32 @ ^6.13.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM32
monitor_port = COM32
board_build.partitions = partitions.csv
build_flags =
    -I include
    -D EDGE_MAX_SEQ_LEN=128
    -D EDGE_MAX_TAGS=32
upload_speed = 921600

; Stub mode: no .espdl required — validates CRF + benchmark pipeline on device
[env:esp32-s3-n16r8-stub]
board = esp32-s3-wroom-n8r8
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.sdkconfig = sdkconfig.esp32-s3-n16r8-espdl
build_flags =
    ${env.build_flags}
    -D EDGE_USE_STUB=1

; ESP-DL mode: requires deploy/esp32-s3/models/edgefs_model.espdl
[env:esp32-s3-n16r8-espdl]
board = esp32-s3-wroom-n8r8
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D EDGE_USE_ESP_DL=1
    -D EDGE_USE_FIRMWARE_BLOCKS=1
    -D EDGE_HAS_ESPDL_MODEL=1
    -D EDGE_NUM_TAGS=8
build_unflags =
    -D EDGE_USE_STUB=1
extra_scripts =
    pre:scripts/pio_pre_gen_assets.py
board_build.sdkconfig = sdkconfig.esp32-s3-n16r8-espdl

; UART eval mode: host sends sentences over serial for full CoNLL test
[env:esp32-s3-n16r8-espdl-uart]
extends = env:esp32-s3-n16r8-espdl
build_flags =
    ${env:esp32-s3-n16r8-espdl.build_flags}
    -D EDGE_UART_EVAL=1
board_build.sdkconfig = sdkconfig.esp32-s3-n16r8-espdl-uart
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.uart.defaults

; Pure ESP-DL INT8 (no firmware TemporalCNN) — paper Table 3 / stage timers
[env:esp32-s3-n16r8-espdl-pure]
board = esp32-s3-wroom-n8r8
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -D EDGE_USE_ESP_DL=1
    -D EDGE_HAS_ESPDL_MODEL=1
    -D EDGE_NUM_TAGS=8
build_unflags =
    -D EDGE_USE_STUB=1
extra_scripts =
    pre:scripts/pio_pre_gen_assets.py
board_build.sdkconfig = sdkconfig.esp32-s3-n16r8-espdl

[env:esp32-s3-n16r8-espdl-uart-pure]
extends = env:esp32-s3-n16r8-espdl-pure
build_flags =
    ${env:esp32-s3-n16r8-espdl-pure.build_flags}
    -D EDGE_UART_EVAL=1
board_build.sdkconfig = sdkconfig.esp32-s3-n16r8-espdl-uart-pure
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.uart.defaults

; Pure INT8 UART eval over GPIO UART1 (USB = power / flash only; TTL for protocol)
; Wiring: ESP TX GPIO17 -> TTL RX; ESP RX GPIO18 -> TTL TX; GND common; 115200 8N1
[env:esp32-s3-n16r8-espdl-uart-pure-gpio]
extends = env:esp32-s3-n16r8-espdl-pure
build_flags =
    ${env:esp32-s3-n16r8-espdl-pure.build_flags}
    -D EDGE_UART_EVAL=1
    -D EDGE_UART_GPIO=1
    -D EDGE_UART_TX_GPIO=17
    -D EDGE_UART_RX_GPIO=18
    -D EDGE_UART_BAUD=115200
board_build.sdkconfig = sdkconfig.esp32-s3-n16r8-espdl-uart-pure
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.uart.defaults
