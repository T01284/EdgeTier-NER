name: full_conll2003_bilstm
dataset_config: configs/dataset/conll2003.yaml
model_config: configs/model/bilstm_crf_glove.yaml
embeddings:
  glove_dir: data/embeddings
  dim: 100
train:
  epochs: 50
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  max_len: 128
  device: cuda
  seed: 42
  output_dir: outputs/runs/conll2003_bilstm
  lr_scheduler: plateau
  scheduler_patience: 3
  scheduler_factor: 0.5
