name: cluener_fewshot_protobert_4w1s
dataset_config: configs/dataset/cluener_autodl.yaml
model_config: configs/model/bert_crf_chinese.yaml
fewshot:
  method: protobert
  n_way: 4
  k_shot: 1
  num_episodes: 5
  query_size: 200
train:
  epochs: 5
  batch_size: 16
  lr: 5e-05
  weight_decay: 0.01
  max_len: 128
  device: cuda
  seed: 42
  lambda_proto: 1.0
  lambda_contrastive: 0.0
  lambda_struct: 0.0
  support_only: false
  nn_k: 1
  lr_scheduler: plateau
  scheduler_patience: 2
  scheduler_factor: 0.5
  output_dir: /root/autodl-tmp/EdgeFS_NER/outputs/runs/cluener_fewshot_protobert_4w1s
